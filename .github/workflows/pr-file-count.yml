name: PR file count

on:
  pull_request:

concurrency:
  group: pr-file-count-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-file-count:
    name: Max 10 files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sin credenciales (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Enforce max 10 files per PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/check-pr-file-count.mjs
